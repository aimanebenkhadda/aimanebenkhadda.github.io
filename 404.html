<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 · Aïmane Benkhadda</title>
  <link rel="icon" href="/images/favicon-32x32.png" type="image/png" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0d1f; color: #d8dcef; font: 16px/1.6 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
    main { max-width: 560px; padding: 32px 16px; }
    h1 { margin: 0 0 16px; font-size: 20px; color: #f2c811; letter-spacing: .04em; }
    p { margin: 0 0 12px; }
    .muted { color: #8a90b0; }
    a { color: #f2c811; }
    .links { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; }
    .cursor { display: inline-block; width: 10px; height: 18px; background: #d8dcef; vertical-align: -3px; animation: b 1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>ERREUR 404 · ERROR 404</h1>
    <p>Cette page n’existe pas (ou plus).</p>
    <p class="muted">This page doesn’t exist (anymore).</p>
    <div class="links">
      <a href="/?lang=fr">Retour au portfolio</a>
      <a href="/?lang=en">Back to the portfolio</a>
      <a href="/os/?lang=fr">Version sans 3D</a>
      <a href="/os/?lang=en">No-3D version</a>
    </div>
    <p style="margin-top:24px"><span class="cursor"></span></p>
  </main>
</body>
</html>
